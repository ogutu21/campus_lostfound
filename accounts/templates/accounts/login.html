{% extends "base.html" %}

{% block title %}Sign in{% endblock %}

{% block content %}
<h1>Sign in</h1>
<p>Use your Google account. The first time, you'll also enter your student
registration number so we know you belong to the campus.</p>

<form method="post" action="{% url 'google_login' %}">
  {% csrf_token %}
  {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
  <button type="submit" class="btn-ink">Continue with Google</button>
</form>
{% endblock %}
