<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14213D">
  <title>Offline - Campus Lost &amp; Found</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           background: #EEF2F1; color: #14213D; text-align: center; padding: 1.5rem;
           font: 1.0625rem/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ring { width: 4.5rem; height: 4.5rem; margin: 0 auto 1.25rem; border-radius: 50%;
            border: .9rem solid #F2A900; }
    h1 { margin: 0 0 .5rem; font-size: 1.8rem; }
    p { margin: 0 0 1.25rem; color: #4A5670; }
    button { min-height: 2.75rem; padding: .55rem 1.4rem; border: 2px solid #14213D;
             border-radius: 8px; background: #F2A900; color: #14213D;
             font: 700 1rem system-ui, sans-serif; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <div class="ring" aria-hidden="true"></div>
    <h1>You're offline</h1>
    <p>Check your internet connection, then try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
