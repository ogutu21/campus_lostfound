{% extends "base.html" %}

{% block title %}{{ heading }}{% endblock %}

{% block content %}
<h2>{{ heading }}</h2>
<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Save</button>
  <a href="{% url 'items:list' %}">Cancel</a>
</form>
{% endblock %}
