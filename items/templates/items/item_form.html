{% extends "base.html" %}

{% block title %}Report a post{% endblock %}

{% block content %}
<h2>Report this post</h2>
<p class="meta">
  You are reporting: <strong>{{ item.title }}</strong>.
  The poster will not be told who reported it.
</p>

<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Send report</button>
  <a href="{% url 'items:detail' item.pk %}">Cancel</a>
</form>
{% endblock %}
