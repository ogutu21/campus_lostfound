{% extends "base.html" %}

{% block title %}Delete post{% endblock %}

{% block content %}
<h2>Delete "{{ item.title }}"?</h2>
<p>This cannot be undone.</p>
<form method="post">
  {% csrf_token %}
  <button type="submit">Yes, delete</button>
  <a href="{% url 'items:detail' item.pk %}">Cancel</a>
</form>
{% endblock %}
